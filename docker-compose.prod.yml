services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: production

    container_name: siae-api-production

    ports:
      - "3001:3000"

    env_file:
      - .env.prod

    environment:
      NODE_ENV: production
      PORT: 3000

    restart: unless-stopped

    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/health/ready').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
